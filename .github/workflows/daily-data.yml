name: 매일 커피 데이터 갱신

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 UTC 21시 = 한국시간 06시 (ICE 종가 반영 후)
  workflow_dispatch: {}      # GitHub UI에서 수동 실행도 가능

permissions:
  contents: write            # 갱신된 데이터를 커밋하려면 필요

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r data-engine/requirements.txt

      - name: 수집 + 계산 + export 실행
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: |
          cd data-engine
          python collectors/fx_collector.py
          python collectors/coffee_c_collector.py
          python models/export_cost.py
          python models/export_timeseries.py

      - name: 갱신된 데이터 커밋
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "data: 일일 커피 데이터 자동 갱신"
          file_pattern: "data-engine/data/clean/* web/public/data/*"
